name: validate

on:
  push:
    branches: [main]
    paths: ['packages/**', 'tools/**', 'worker/**', 'index.json']
  pull_request:
    paths: ['packages/**', 'tools/**', 'worker/**', 'index.json']

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate index.json on main
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          tools/gen-index.sh
          if ! git diff --quiet -- index.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -qm "regen index.json"
            git push
          fi
      - run: tools/validate.sh
